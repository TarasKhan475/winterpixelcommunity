<!-- ===================== SCRIPTS ===================== -->
<!-- Firebase SDKs — all three required -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Bottom bar — inits Firebase, handles auth session, shows account pill -->
<script src="js/bottom-bar-loader.js"></script>

<!-- News data and card rendering -->
<script src="data/news.js"></script>
<script src="js/news-loader.js"></script>

<!-- Votes — polls until Firebase auth ready + cards in DOM -->
<script src="js/firebase-votes.js"></script>

<script>
/* Hamburger */
(function() {
  var btn = document.getElementById('hamburger');
  var menu = document.getElementById('mobile-menu');
  btn.addEventListener('click', function() {
    var open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
    menu.setAttribute('aria-hidden', !open);
  });
  menu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      menu.setAttribute('aria-hidden', 'true');
    });
  });
})();

/* Tag filters */
document.getElementById('news-filters').addEventListener('click', function(e) {
  var pill = e.target.closest('.filter-pill');
  if (!pill) return;
  document.querySelectorAll('.filter-pill').forEach(function(p) { p.classList.remove('active'); });
  pill.classList.add('active');
  var filter = pill.dataset.filter;
  document.querySelectorAll('.news-full-card').forEach(function(card) {
    if (filter === 'all') {
      card.style.display = '';
    } else {
      var tag = card.querySelector('.news-tag');
      card.style.display = (tag && tag.textContent.trim() === filter) ? '' : 'none';
    }
  });
});
</script>
