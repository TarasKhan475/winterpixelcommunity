<script>
// ================================================================
// FIREBASE CONFIG
// ================================================================
const firebaseConfig = {
  apiKey:            "AIzaSyDyrbOkMUrDcXmeE3WlwNrWbkOVNg-UGEg",
  authDomain:        "winterpixelcommunity.firebaseapp.com",
  projectId:         "winterpixelcommunity",
  storageBucket:     "winterpixelcommunity.firebasestorage.app",
  messagingSenderId: "590927242514",
  appId:             "1:590927242514:web:d99b37ff6ad67f1b83ffcb"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ================================================================
// HELPERS
// ================================================================
function lsGet(key) { try { var r=localStorage.getItem(key); return r?JSON.parse(r):null; } catch(e){return null;} }
function lsSet(key,val) { try { localStorage.setItem(key,JSON.stringify(val)); } catch(e){} }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function initials(u) { return (u||'?').charAt(0).toUpperCase(); }

function formatDate(ts) {
  if (!ts) return 'Unknown';
  var d;
  // Firestore Timestamp object (live)
  if (ts && typeof ts.toDate === 'function') {
    d = ts.toDate();
  // Firestore Timestamp serialized as {seconds, nanoseconds}
  } else if (ts && typeof ts.seconds === 'number') {
    d = new Date(ts.seconds * 1000);
  // Plain number (ms)
  } else if (typeof ts === 'number') {
    d = new Date(ts);
  } else {
    d = new Date(ts);
  }
  if (isNaN(d.getTime())) return 'Unknown';
  return d.toLocaleDateString('en-US', { year:'numeric', month:'long' });
}

// ================================================================
// PFP CATALOGUE — 100 placeholders, swap paths for real images
// Naming: ui/icons/pfp/pfp_001.png … pfp_100.png
// ================================================================
var PFP_LIST = [];
for (var i = 1; i <= 100; i++) {
  PFP_LIST.push('ui/icons/pfp/pfp_' + String(i).padStart(3,'0') + '.png');
}

// ================================================================
// STATE
// ================================================================
var currentUser    = null;
var currentProfile = null;   // logged-in user's own profile
var viewedProfile  = null;   // profile being viewed
var selectedPfp    = null;   // pending pfp selection

var PROFILE_CACHE_TTL = 300000; // 5 min

// ================================================================
// URL PARAMS
// ================================================================
var params       = new URLSearchParams(window.location.search);
var targetUser   = (params.get('user') || '').trim();  // ?user=Username

// ================================================================
// LOAD PROFILE BY USERNAME
// ================================================================
function loadProfile(username) {
  if (!username) { showNotFound(); return; }

  // Check localStorage cache first
  var cacheKey = 'profile_view_' + username.toLowerCase();
  var cached   = lsGet(cacheKey);
  if (cached && Date.now() - cached.ts < PROFILE_CACHE_TTL) {
    renderProfile(cached.data);
    return;
  }

  // Look up uid from username index, then fetch user doc
  db.collection('usernames').doc(username.toLowerCase()).get()
    .then(function(snap) {
      if (!snap.exists) { showNotFound(); return; }
      var uid = snap.data().uid;
      return db.collection('users').doc(uid).get();
    })
    .then(function(doc) {
      if (!doc || !doc.exists) { showNotFound(); return; }
      var data = Object.assign({ _uid: doc.id }, doc.data());
      lsSet('profile_view_' + username.toLowerCase(), { ts: Date.now(), data: data });
      renderProfile(data);
    })
    .catch(function(err) {
      console.error('Profile load failed:', err);
      showNotFound();
    });
}

// ================================================================
// RENDER PROFILE
// ================================================================
function renderProfile(data) {
  viewedProfile = data;
  document.getElementById('profile-skeleton').style.display = 'none';
  document.getElementById('profile-view').style.display     = 'block';

  // SEO
  document.title = data.username + ' — Winterpixel Community';

  // Avatar
  var avatarWrap = document.getElementById('view-avatar');
  if (data.pfp) {
    avatarWrap.innerHTML = '<img src="'+escHtml(data.pfp)+'" alt="'+escHtml(data.username)+'" onerror="this.style.display=\'none\';this.parentElement.textContent=\''+initials(data.username)+'\'" />';
  } else {
    avatarWrap.textContent = initials(data.username);
  }

  // Username + mod color
  var usernameEl = document.getElementById('view-username');
  if (data.mod) {
    usernameEl.innerHTML = '<span class="mod-name">'+escHtml(data.username)+'</span><span class="profile-mod-label">MOD</span>';
  } else {
    usernameEl.textContent = data.username;
  }

  // Bio
  var descEl = document.getElementById('view-desc');
  if (data.bio && data.bio.trim()) {
    descEl.textContent = data.bio;
    descEl.classList.remove('empty');
  } else {
    descEl.textContent = 'No bio yet.';
    descEl.classList.add('empty');
  }

  // Badges (placeholder — will populate when badge system is added)
  var badgesEl = document.getElementById('view-badges');
  badgesEl.innerHTML = '';
  if (data.badges && data.badges.length) {
    data.badges.forEach(function(b) {
      var span = document.createElement('span');
      span.className = 'profile-badge';
      span.textContent = b;
      badgesEl.appendChild(span);
    });
  }

  // Stats
  document.getElementById('view-msgcount').textContent = (data.messageCount || 0).toLocaleString();
  document.getElementById('view-joined').textContent   = formatDate(data.createdAt);

  // Show customize panel only if viewing own profile
  if (currentUser && currentUser.uid === data._uid) {
    showCustomizePanel(data);
  }
}

// ================================================================
// CUSTOMIZE PANEL — only for own profile
// ================================================================
function showCustomizePanel(data) {
  // Show the customize trigger button and make avatar clickable
  var triggerWrap = document.getElementById('customize-trigger-wrap');
  if (triggerWrap) triggerWrap.style.display = 'block';

  // Pre-fill bio
  document.getElementById('bio-input').value = data.bio || '';

  // Build PFP grid (only once — avoid rebuilding on every auth state change)
  if (!document.getElementById('pfp-grid').dataset.built) {
    buildPfpGrid(data.pfp || null);
    document.getElementById('pfp-grid').dataset.built = '1';
  }

  // Avatar click → open panel scrolled to pfp picker
  var avatarWrap = document.getElementById('view-avatar');
  if (!avatarWrap.dataset.customizeReady) {
    avatarWrap.style.cursor = 'pointer';
    // Add camera overlay
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);opacity:0;transition:opacity 0.15s;pointer-events:none;';
    overlay.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
    avatarWrap.appendChild(overlay);
    avatarWrap.addEventListener('mouseenter', function(){ overlay.style.opacity='1'; });
    avatarWrap.addEventListener('mouseleave', function(){ overlay.style.opacity='0'; });
    avatarWrap.addEventListener('click', function() {
      openCustomizePanel();
      setTimeout(function(){
        var pfpCard = document.getElementById('pfp-grid');
        if (pfpCard) pfpCard.closest('.profile-card').scrollIntoView({ behavior:'smooth', block:'start' });
      }, 100);
    });
    avatarWrap.dataset.customizeReady = '1';
  }

  // Customize button — use onclick to avoid stacking listeners
  var triggerBtn = document.getElementById('customize-trigger-btn');
  if (triggerBtn) triggerBtn.onclick = openCustomizePanel;

  // Close button — use onclick
  var closeBtn = document.getElementById('customize-close-btn');
  if (closeBtn) closeBtn.onclick = closeCustomizePanel;

  // Bio save — use onclick
  document.getElementById('bio-save-btn').onclick = saveBio;

  // PFP save — use onclick
  document.getElementById('pfp-save-btn').onclick = savePfp;
}

function openCustomizePanel() {
  var panel = document.getElementById('customize-panel');
  panel.style.display = 'block';
  setTimeout(function(){ panel.scrollIntoView({ behavior:'smooth', block:'start' }); }, 50);
  var btn = document.getElementById('customize-trigger-btn');
  if (btn) {
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Close editor';
    btn.onclick = closeCustomizePanel;
  }
}

function closeCustomizePanel() {
  document.getElementById('customize-panel').style.display = 'none';
  var btn = document.getElementById('customize-trigger-btn');
  if (btn) {
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="17" y1="3" x2="21" y2="7"/><path d="M3 21h4l13-13-4-4L3 17z"/></svg> Customize profile';
    btn.onclick = openCustomizePanel;
  }
}

function buildPfpGrid(currentPfp) {
  var grid = document.getElementById('pfp-grid');
  grid.innerHTML = '';
  selectedPfp = currentPfp;

  PFP_LIST.forEach(function(path) {
    var div = document.createElement('div');
    div.className = 'pfp-option' + (path === currentPfp ? ' selected' : '');
    div.dataset.path = path;

    var img = document.createElement('img');
    img.src = path;
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = function() { div.style.display='none'; };
    div.appendChild(img);

    div.addEventListener('click', function() {
      document.querySelectorAll('.pfp-option').forEach(function(o){ o.classList.remove('selected'); });
      div.classList.add('selected');
      selectedPfp = path;
    });

    grid.appendChild(div);
  });
}

function savePfp() {
  if (!currentUser || !selectedPfp) return;
  var btn = document.getElementById('pfp-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';

  db.collection('users').doc(currentUser.uid).update({ pfp: selectedPfp })
    .then(function() {
      btn.disabled = false; btn.textContent = 'Save avatar';
      showSaveStatus('pfp-save-status');

      // Update cached profile
      if (currentProfile) currentProfile.pfp = selectedPfp;
      lsSet('forum_profile_'+currentUser.uid, { ts:Date.now(), data:currentProfile });

      // Invalidate view cache so reload reflects change
      var key = 'profile_view_' + (currentProfile.username||'').toLowerCase();
      localStorage.removeItem(key);

      // Update avatar in hero — rebuild with overlay intact
      var avatarWrap = document.getElementById('view-avatar');
      // Remove ready flag so showCustomizePanel re-attaches overlay
      delete avatarWrap.dataset.customizeReady;
      avatarWrap.innerHTML = '<img src="'+escHtml(selectedPfp)+'" alt="" />';
      // Re-attach customize overlay
      showCustomizePanel(currentProfile);

      // Update bottom bar avatar
      renderBottomBarAvatar(currentProfile);
    })
    .catch(function(err) {
      console.error('PFP save failed:', err);
      btn.disabled = false; btn.textContent = 'Save avatar';
    });
}

function saveBio() {
  if (!currentUser) return;
  var btn  = document.getElementById('bio-save-btn');
  var bio  = document.getElementById('bio-input').value.slice(0, 160);
  btn.disabled = true; btn.textContent = 'Saving…';

  db.collection('users').doc(currentUser.uid).update({ bio: bio })
    .then(function() {
      btn.disabled = false; btn.textContent = 'Save bio';
      showSaveStatus('bio-save-status');

      // Update cached profile
      if (currentProfile) currentProfile.bio = bio;
      lsSet('forum_profile_'+currentUser.uid, { ts:Date.now(), data:currentProfile });
      var key = 'profile_view_' + (currentProfile.username||'').toLowerCase();
      localStorage.removeItem(key);

      // Update displayed bio
      var descEl = document.getElementById('view-desc');
      if (bio.trim()) {
        descEl.textContent = bio;
        descEl.classList.remove('empty');
      } else {
        descEl.textContent = 'No bio yet.';
        descEl.classList.add('empty');
      }
    })
    .catch(function(err) {
      console.error('Bio save failed:', err);
      btn.disabled = false; btn.textContent = 'Save bio';
    });
}

function showSaveStatus(id) {
  var el = document.getElementById(id);
  el.style.display = 'inline';
  el.style.opacity = '1';
  setTimeout(function() {
    el.style.transition = 'opacity 0.5s';
    el.style.opacity = '0';
    setTimeout(function(){ el.style.display='none'; el.style.opacity='1'; el.style.transition=''; }, 500);
  }, 2000);
}

// ================================================================
// NOT FOUND
// ================================================================
function showNotFound() {
  document.getElementById('profile-skeleton').style.display  = 'none';
  document.getElementById('profile-not-found').style.display = 'block';
}

// ================================================================
// BOTTOM BAR AUTH
// ================================================================
var unsubNotifications = null;

function renderBottomBarAvatar(profile) {
  var wrap = document.getElementById('account-avatar-wrap');
  if (profile && profile.pfp) {
    wrap.innerHTML = '<img src="'+escHtml(profile.pfp)+'" alt="" onerror="this.style.display=\'none\'" />';
  } else {
    wrap.innerHTML = '<span style="font-size:13px;font-weight:800;color:white;">'+initials(profile && profile.username)+'</span>';
  }
}

auth.onAuthStateChanged(function(user) {
  currentUser = user;

  if (user) {
    var profileKey    = 'forum_profile_' + user.uid;
    var cachedProfile = lsGet(profileKey);
    if (cachedProfile && Date.now() - cachedProfile.ts < 300000) {
      currentProfile = cachedProfile.data;
      onLoggedIn();
    } else {
      db.collection('users').doc(user.uid).get().then(function(doc) {
        currentProfile = doc.exists ? doc.data() : { username:'Unknown' };
        lsSet(profileKey, { ts:Date.now(), data:currentProfile });
        onLoggedIn();
      });
    }
  } else {
    currentProfile = null;
    onLoggedOut();
  }

  // Load the profile once auth is known (so own-profile check works)
  if (!profileLoaded) {
    profileLoaded = true;
    loadProfile(targetUser);
  }
});

var profileLoaded = false;

function onLoggedIn() {
  document.getElementById('open-auth-btn').style.display  = 'none';
  document.getElementById('account-pill').style.display   = 'flex';
  document.getElementById('account-username').textContent = currentProfile.username || 'User';
  document.getElementById('my-profile-link').href = 'profile.html?user=' + encodeURIComponent(currentProfile.username);
  renderBottomBarAvatar(currentProfile);

  // Unread count listener
  if (unsubNotifications) unsubNotifications();
  unsubNotifications = db.collection('users').doc(currentUser.uid)
    .collection('notifications').where('read','==',false)
    .onSnapshot(function(snap) {
      var badge = document.getElementById('notif-count');
      if (snap.size > 0) {
        badge.textContent = snap.size > 9 ? '9+' : snap.size;
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }, function(){});

  // If the viewed profile is now known to be ours, show customise panel
  if (viewedProfile && currentUser.uid === viewedProfile._uid && document.getElementById('customize-panel').style.display === 'none') {
    showCustomizePanel(viewedProfile);
  }
}

function onLoggedOut() {
  document.getElementById('open-auth-btn').style.display  = 'block';
  document.getElementById('account-pill').style.display   = 'none';
  if (unsubNotifications) { unsubNotifications(); unsubNotifications = null; }
}

// ================================================================
// BOTTOM BAR INTERACTIONS
// ================================================================
var notifOpen = false, accountOpen = false;

document.getElementById('notif-btn').addEventListener('click', function(e) {
  e.stopPropagation();
  notifOpen = !notifOpen;
  document.getElementById('notif-modal').classList.toggle('open', notifOpen);
  if (notifOpen && currentUser) {
    var list = document.getElementById('notif-list');
    list.innerHTML = '<div style="padding:1rem;text-align:center;font-size:12px;color:#475569;">Loading…</div>';
    db.collection('users').doc(currentUser.uid).collection('notifications')
      .orderBy('createdAt','desc').limit(20).get()
      .then(function(snap) {
        if (snap.empty) { list.innerHTML='<div style="padding:1.5rem;text-align:center;font-size:13px;color:#475569;">No notifications yet</div>'; return; }
        list.innerHTML = '';
        snap.forEach(function(doc) {
          var n = doc.data();
          var div = document.createElement('div');
          div.className = 'notif-item' + (n.read ? '' : ' unread');
          // Show "Username replied: preview" for reply notifications, just preview for others
          var notifText = n.type === 'reply'
            ? '<strong>' + escHtml(n.fromUser || 'Someone') + '</strong> replied: ' + escHtml(n.preview || '')
            : escHtml(n.preview || 'New notification');
          div.innerHTML = '<div class="notif-item-avatar">'+(n.type==='reply'?'↩':'🔔')+'</div>'+
            '<div class="notif-item-text">'+
              '<div class="notif-item-name">'+notifText+'</div>'+
            '</div>';
          if (n.channel && n.messageId) {
            div.style.cursor = 'pointer';
            div.addEventListener('click', function(){
              window.location.href = 'forum.html?ch='+encodeURIComponent(n.channel)+'&msg='+encodeURIComponent(n.messageId);
            });
          }
          list.appendChild(div);
        });
        // Mark all read
        var batch = db.batch();
        snap.forEach(function(doc){ if (!doc.data().read) batch.update(doc.ref,{read:true}); });
        batch.commit().catch(function(){});
      });
  }
  accountOpen = false; document.getElementById('account-menu').classList.remove('open');
});

document.getElementById('account-pill').addEventListener('click', function(e) {
  e.stopPropagation();
  accountOpen = !accountOpen;
  document.getElementById('account-menu').classList.toggle('open', accountOpen);
  notifOpen = false; document.getElementById('notif-modal').classList.remove('open');
});

document.addEventListener('click', function() {
  notifOpen = false; accountOpen = false;
  document.getElementById('notif-modal').classList.remove('open');
  document.getElementById('account-menu').classList.remove('open');
});

document.getElementById('notif-modal').addEventListener('click', function(e){ e.stopPropagation(); });
document.getElementById('account-menu').addEventListener('click', function(e){ e.stopPropagation(); });

document.getElementById('logout-btn').addEventListener('click', function() {
  if (currentUser) { try { localStorage.removeItem('forum_profile_'+currentUser.uid); } catch(e){} }
  auth.signOut();
});

// ================================================================
// HAMBURGER
// ================================================================
(function() {
  var hbtn  = document.getElementById('hamburger');
  var hmenu = document.getElementById('mobile-menu');
  hbtn.addEventListener('click', function() {
    var open = hmenu.classList.toggle('open');
    hbtn.setAttribute('aria-expanded', open);
    hmenu.setAttribute('aria-hidden', !open);
  });
  hmenu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      hmenu.classList.remove('open');
      hbtn.setAttribute('aria-expanded','false');
      hmenu.setAttribute('aria-hidden','true');
    });
  });
})();
</script>
