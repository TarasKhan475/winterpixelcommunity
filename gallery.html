  <link rel="stylesheet" href="css/main.css" />
  <style>
    .gallery-hero {
      position: relative;
      overflow: hidden;
      background-image: url('ui/tile.png');
      background-repeat: repeat;
      animation: gallery-tile-pan 30s linear infinite;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      gap: 12px;
      padding: 20px 1.5rem 24px;
    }
    .gallery-hero::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%);
    }
    @keyframes gallery-tile-pan {
      from { background-position: 0 0; }
      to   { background-position: 400px 400px; }
    }

    .gallery-search-hero { position: relative; z-index: 1; max-width: 560px; width: 100%; }
    .gallery-search-box {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255,255,255,0.8);
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      transition: background 0.15s;
    }
    .gallery-search-box:focus-within { background: rgba(255,255,255,0.3); }
    .gallery-search-box svg { flex-shrink: 0; color: var(--blue-deep); }
    .gallery-search-box input {
      flex: 1; border: none; background: transparent;
      font-family: 'Baloo 2', cursive; font-size: 14px; font-weight: 600;
      color: var(--blue-deep); outline: none;
    }
    .gallery-search-box input::placeholder { color: rgba(17,17,17,0.45); }

    .gallery-layout { max-width: 1200px; margin: 0 auto; padding: 1rem 1.25rem 3rem; }

    /* Game filter — single scrollable row, never wraps */
    .gallery-filters-wrap { position: relative; z-index: 1; max-width: 720px; width: 100%; }
    .gallery-filters {
      display: flex; flex-wrap: nowrap; overflow-x: auto;
      gap: 2px; align-items: center;
      scrollbar-width: none; -ms-overflow-style: none;
      padding: 0 6px;
    }
    .gallery-filters::-webkit-scrollbar { display: none; }
    .gallery-pill {
      flex: 0 0 auto;
      padding: 5px 14px; border-radius: 9999px; border: none;
      background: white;
      font-family: 'Baloo 2', cursive; font-size: 13px; font-weight: 700;
      color: var(--blue); cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .gallery-pill:hover  { background: var(--blue-pale); }
    .gallery-pill.active { background: var(--blue); color: white; }
    .gallery-pill-icon {
      padding: 2px; background: transparent;
      display: flex; align-items: center; justify-content: center;
    }
    .gallery-pill-icon img {
      width: 44px; height: 44px; object-fit: contain; display: block;
      transition: transform 0.12s, opacity 0.12s; opacity: 0.6;
    }
    .gallery-pill-icon:hover img { opacity: 1; transform: scale(1.08); }
    .gallery-pill-icon.active { background: transparent; }
    .gallery-pill-icon.active img { opacity: 1; transform: scale(1.12); }

    .filters-glow {
      position: absolute; top: 0; bottom: 0; width: 36px;
      pointer-events: none; opacity: 0; transition: opacity 0.15s;
    }
    .filters-glow.left  { left: 0;  background: linear-gradient(to right, rgba(255,255,255,0.95), transparent); }
    .filters-glow.right { right: 0; background: linear-gradient(to left,  rgba(255,255,255,0.95), transparent); }
    .filters-glow.visible { opacity: 1; }

    .gallery-results-count { font-size: 12px; color: var(--gray-muted); margin: 12px 0 10px; text-align: center; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .thumb-card {
      border-radius: var(--radius-md); overflow: hidden;
      border: none; background: var(--blue-pale);
      cursor: pointer; padding: 0;
      aspect-ratio: 16 / 9;
      content-visibility: auto;
      contain-intrinsic-size: 220px 124px;
    }
    .thumb-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.25s ease;
    }
    .thumb-card:hover img { transform: scale(1.08); }

    .gallery-empty {
      display: none; padding: 3rem; text-align: center;
      font-size: 14px; color: var(--gray-muted); grid-column: 1 / -1;
    }

    .lightbox-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.75);
      align-items: center; justify-content: center; padding: 2rem;
    }
    .lightbox-overlay.open { display: flex; }
    .lightbox-box { max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; background: white; border-radius: var(--radius-lg); overflow-x: hidden; }
    .lightbox-img-wrap { background: var(--blue-pale); display: flex; align-items: center; justify-content: center; }
    .lightbox-img-wrap img { width: 100%; max-height: 55vh; object-fit: contain; display: block; }
    .lightbox-footer { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .lightbox-name { font-size: 15px; font-weight: 800; color: var(--blue-deep); }
    .lightbox-game { font-size: 11px; font-weight: 700; color: var(--gray-muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .lightbox-actions { display: flex; gap: 8px; }
    .lightbox-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'Baloo 2', cursive; font-size: 13px; font-weight: 700;
      padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer;
      text-decoration: none; border: none; background: var(--blue-pale); color: var(--blue-deep);
    }
    .lightbox-btn.primary { background: var(--blue); color: white; }
    .lightbox-btn.close-btn { background: #e0e0e0; color: var(--blue-deep); font-weight: 800; }
    .lightbox-close {
      position: absolute; top: 14px; right: 14px;
      background: rgba(0,0,0,0.55); color: white; border: none;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .lightbox-close:hover { background: rgba(0,0,0,0.75); }
    .lightbox-related-label {
      padding: 0 18px; font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--gray-muted); margin-bottom: 8px;
    }
    .lightbox-related-row { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px 18px; }
    .lightbox-related-item {
      flex: 0 0 auto; width: 96px; aspect-ratio: 16 / 9;
      border-radius: 6px; overflow: hidden; padding: 0; border: none;
      cursor: pointer; background: var(--blue-pale);
    }
    .lightbox-related-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

    @media (max-width: 600px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .lightbox-overlay { padding: 0.75rem; }
      .lightbox-img-wrap img { max-height: 40vh; }
      .lightbox-related-item { width: 76px; }
    }

<script>
(function() {
  var btn  = document.getElementById('hamburger');
  var menu = document.getElementById('mobile-menu');
  btn.addEventListener('click', function() {
    var open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
    menu.setAttribute('aria-hidden', !open);
  });
  menu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      menu.setAttribute('aria-hidden', 'true');
    });
  });
})();

var DATA = (typeof THUMBS !== 'undefined' && Array.isArray(THUMBS)) ? THUMBS : [];

var GAME_NAMES = {
  rbr: 'Rocket Bot Royale', gd: 'Goober Dash', projectgatherwood: 'Project Gatherwood',
  broski: 'Broski', bigbattlemini: 'Big Battle Mini', gooberroyale: 'Goober Royale',
  goobershot: 'Goober Shot', gooberworld: 'Goober World', bobble: 'Bobble',
  balloon: 'Balloon', moonrockminers: 'Moon Rock Miners', other: 'Other'
};

// Every DATA entry's "file" points at the compressed lowres copy, e.g.
// "lowres/rbr/epic_win.png". The full-resolution original lives at the
// same path minus that prefix — used for the lightbox and downloads.
function highResPath(lowResFile) {
  return lowResFile.replace(/^lowres\//, '');
}

var _game = 'all';

function setGamePill(btn) {
  document.querySelectorAll('#gallery-filters .gallery-pill').forEach(function(p){ p.classList.remove('active'); });
  btn.classList.add('active');
  _game = btn.dataset.filter;
  filterGallery();
}

/* Fuzzy match: exact substrings rank best; otherwise falls back to an
   in-order character match (so "epwn" still finds "Epic Win"). Returns
   null when there's no match at all. */
function fuzzyScore(text, query) {
  if (!query) return 0;
  text = text.toLowerCase();
  var idx = text.indexOf(query);
  if (idx !== -1) return idx;

  var ti = 0, qi = 0, gaps = 0, firstMatch = -1;
  while (ti < text.length && qi < query.length) {
    if (text[ti] === query[qi]) {
      if (firstMatch === -1) firstMatch = ti;
      qi++;
    } else if (qi > 0) {
      gaps++;
    }
    ti++;
  }
  if (qi < query.length) return null;
  return 1000 + gaps * 10 + firstMatch;
}

function searchableText(t) {
  var bits = [t.name || '', GAME_NAMES[t.game] || t.game || ''];
  if (Array.isArray(t.colors)) bits = bits.concat(t.colors);
  return bits.join(' ').toLowerCase();
}

function cardHtml(t, i) {
  return '<button class="thumb-card" onclick="openLightbox(' + i + ')">' +
    '<img src="ui/thumbnails/' + t.file + '" alt="' + (t.name || '').replace(/"/g,'&quot;') + '" loading="lazy" decoding="async" />' +
  '</button>';
}

var PAGE_SIZE = 30;
var _currentMatches = [];
var _renderedCount = 0;

var _sentinelObserver = new IntersectionObserver(function(entries) {
  if (entries[0].isIntersecting) renderNextBatch();
}, { rootMargin: '400px' });

function renderNextBatch() {
  var grid = document.getElementById('gallery-grid');
  var next = _currentMatches.slice(_renderedCount, _renderedCount + PAGE_SIZE);
  next.forEach(function(o) { grid.insertAdjacentHTML('beforeend', cardHtml(DATA[o.i], o.i)); });
  _renderedCount += next.length;

  var sentinel = document.getElementById('gallery-sentinel');
  if (_renderedCount < _currentMatches.length) {
    _sentinelObserver.observe(sentinel);
  } else {
    _sentinelObserver.unobserve(sentinel);
  }
}

function filterGallery() {
  var q = (document.getElementById('gallery-search').value || '').toLowerCase().trim();
  var grid = document.getElementById('gallery-grid');
  var scored = [];

  DATA.forEach(function(t, i) {
    if (_game !== 'all' && t.game !== _game) return;
    var s = fuzzyScore(searchableText(t), q);
    if (s !== null) scored.push({ i: i, s: s });
  });
  scored.sort(function(a, b) { return a.s - b.s; });

  _currentMatches = scored;
  _renderedCount = 0;
  grid.innerHTML = '';
  renderNextBatch();

  document.getElementById('gallery-empty').style.display = scored.length === 0 ? 'block' : 'none';
  document.getElementById('gallery-count').textContent =
    DATA.length === 0 ? '' : (scored.length + ' of ' + DATA.length + ' thumbnails');
}

var _searchDebounce;
function onGallerySearchInput() {
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(filterGallery, 150);
}

/* Filter row scroll glow */
(function() {
  var el = document.getElementById('gallery-filters');
  var left = document.getElementById('filters-glow-left');
  var right = document.getElementById('filters-glow-right');
  function update() {
    left.classList.toggle('visible', el.scrollLeft > 4);
    right.classList.toggle('visible', el.scrollLeft < el.scrollWidth - el.clientWidth - 4);
  }
  el.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  setTimeout(update, 50);
})();

var DEFAULT_TITLE = document.title;
var DEFAULT_OG_IMAGE = '';
var _urlOwnedByUs = false;

function hexToRgb(hex) {
  if (!hex) return null;
  var h = hex.replace('#', '');
  return [parseInt(h.substring(0,2),16), parseInt(h.substring(2,4),16), parseInt(h.substring(4,6),16)];
}

function colorDistance(hexA, hexB) {
  var a = hexToRgb(hexA), b = hexToRgb(hexB);
  if (!a || !b) return 999;
  return Math.sqrt(Math.pow(a[0]-b[0],2) + Math.pow(a[1]-b[1],2) + Math.pow(a[2]-b[2],2));
}

/* Higher score = more similar. Same game counts most, but color
   closeness and shared name words can still pull in a good match
   from a different game rather than always being same-game-only. */
function similarityScore(current, candidate) {
  var score = 0;
  if (candidate.game === current.game) score += 50;

  var curColors = current.colors || [];
  var candColors = candidate.colors || [];
  curColors.forEach(function(c) { if (candColors.indexOf(c) !== -1) score += 20; });

  score += Math.max(0, 40 - colorDistance(current.hex, candidate.hex) / 6);

  var curWords = (current.name || '').toLowerCase().split(/\s+/).filter(Boolean);
  var candWords = (candidate.name || '').toLowerCase().split(/\s+/).filter(Boolean);
  curWords.forEach(function(w) { if (candWords.indexOf(w) !== -1) score += 8; });

  return score;
}

function relatedHtml(current, currentIndex) {
  var scored = [];
  DATA.forEach(function(t, i) {
    if (i === currentIndex) return;
    scored.push({ i: i, score: similarityScore(current, t) });
  });
  scored.sort(function(a, b) { return b.score - a.score; });
  var related = scored.slice(0, 8).map(function(o) { return o.i; });

  if (!related.length) return '';
  return '<div class="lightbox-related-label">Related thumbnails</div>' +
    '<div class="lightbox-related-row">' +
    related.map(function(i) {
      var t = DATA[i];
      return '<button class="lightbox-related-item" onclick="openLightbox(' + i + ')"><img src="ui/thumbnails/' + t.file + '" alt="' + (t.name||'').replace(/"/g,'&quot;') + '" loading="lazy" decoding="async" /></button>';
    }).join('') +
    '</div>';
}


function openLightbox(i, opts) {
  var t = DATA[i];
  if (!t) return;
  var highres = highResPath(t.file);

  document.getElementById('lightbox-img').src = 'ui/thumbnails/' + highres;
  document.getElementById('lightbox-img').alt = t.name || '';
  document.getElementById('lightbox-name').textContent = t.name || '';
  document.getElementById('lightbox-game').textContent = GAME_NAMES[t.game] || t.game || '';
  var dl = document.getElementById('lightbox-download');
  dl.href = 'ui/thumbnails/' + highres;
  dl.download = highres.split('/').pop();
  document.getElementById('lightbox-related').innerHTML = relatedHtml(t, i);
  document.getElementById('lightbox-overlay').classList.add('open');
  document.getElementById('lightbox-box').scrollTop = 0;

  document.title = t.name + ' — Chaos Clan Gallery';
  var ogImg = document.getElementById('meta-og-image');
  if (ogImg) ogImg.setAttribute('content', location.origin + '/ui/thumbnails/' + highres);

  var fromUrl = opts && opts.fromUrl;
  if (!fromUrl) {
    try {
      history.pushState({ lightbox: true }, '', '?t=' + encodeURIComponent(highres));
      _urlOwnedByUs = true;
    } catch (e) {
      console.warn('Could not update the URL for this thumbnail:', e);
    }
  }
}

function closeLightboxUI() {
  document.getElementById('lightbox-overlay').classList.remove('open');
  document.title = DEFAULT_TITLE;
  var ogImg = document.getElementById('meta-og-image');
  if (ogImg) ogImg.setAttribute('content', DEFAULT_OG_IMAGE);
}

function closeLightbox() {
  closeLightboxUI();
  try {
    if (_urlOwnedByUs && history.state && history.state.lightbox) {
      history.back();
    } else {
      history.replaceState(null, '', location.pathname);
    }
  } catch (e) {
    console.warn('Could not reset the URL after closing:', e);
  }
  _urlOwnedByUs = false;
}

function shareCurrentThumb() {
  var btn = document.getElementById('lightbox-share');
  navigator.clipboard.writeText(location.href).then(function() {
    var original = btn.innerHTML;
    btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    setTimeout(function() { btn.innerHTML = original; }, 1300);
  });
}

window.addEventListener('popstate', function(e) {
  if (e.state && e.state.lightbox) return; // handled by the pushState that created it
  closeLightboxUI();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

filterGallery();

/* Deep link support: ?t=<path> opens straight to that thumbnail's modal
   on load — this is also how index.html's mini gallery links here. */
(function openFromUrlIfPresent() {
  var params = new URLSearchParams(location.search);
  var target = params.get('t');
  if (!target) return;
  var idx = DATA.findIndex(function(t) { return highResPath(t.file) === target; });
  if (idx !== -1) openLightbox(idx, { fromUrl: true });
})();
</script>
