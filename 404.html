<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    .page-404 {
      min-height: calc(100vh - 50px - 52px);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 2rem;
    }

    .page-404-bg {
      position: absolute;
      inset: 0;
      background-image: url('/ui/tile.png');
      background-repeat: repeat;
      background-size: auto;

      animation: tile-scroll 20s linear infinite;
      pointer-events: none;
    }

    @keyframes tile-scroll {
      from { background-position: 0 0; }
      to   { background-position: 120px 120px; }
    }

    /* White gradient at the bottom before footer */
    .page-404-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100%;
      background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, #ffffff 100%);
      pointer-events: none;
    }

    /* Content sits above the bg layers */
    .page-404-content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .page-404-img {
      width: 180px;
      height: auto;
      opacity: 0.9;
    }

    .page-404-code {
      font-size: 72px;
      font-weight: 800;
      color: var(--blue-deep);
      line-height: 1;
      letter-spacing: -2px;
    }

    .page-404-code span {
      color: var(--blue);
    }

    .page-404-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--blue-deep);
    }

    .page-404-sub {
      font-size: 15px;
      color: var(--gray-mid);
      font-weight: 500;
      max-width: 340px;
      line-height: 1.6;
    }

    .page-404-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 0.5rem;
      background: var(--blue);
      color: white;
      text-decoration: none;
      border-radius: var(--radius-sm);
      padding: 10px 24px;
      font-family: 'Baloo 2', cursive;
      font-size: 14px;
      font-weight: 700;
      transition: background var(--transition), transform var(--transition);
    }

    .page-404-btn:hover {
      background: var(--blue-mid);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<!-- ===================== 404 ===================== -->
<div class="page-404">
  <div class="page-404-bg"></div>

  <div class="page-404-content">
    <img
      src="/ui/Worker_Tank.png"
      alt="404"
      class="page-404-img"
      onerror="this.style.display='none'"
    />

    <div class="page-404-code">404</div>
    <div class="page-404-title">Page Not Found</div>
    <p class="page-404-sub">Oops! The page you are looking for does not exist.</p>
    <a href="index.html" class="page-404-btn">

    </a>
  </div>

  <div class="page-404-fade"></div>
</div>

    </div>
    <p class="footer-copy">Not affiliated with or endorsed by Winterpixel</p>
  </div>

<script src="js/bottom-bar-loader.js"></script>

<script>
(function() {
  var btn  = document.getElementById('hamburger');
  var menu = document.getElementById('mobile-menu');
  btn.addEventListener('click', function() {
    var open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open);
    menu.setAttribute('aria-hidden', !open);
  });
  menu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', function() {
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      menu.setAttribute('aria-hidden', 'true');
    });
  });
})();
</script>

</body>
</html>
